databases:
  - name: green-pavlodar-db
    plan: free

services:
  - type: web
    name: green-pavlodar
    runtime: docker
    dockerfilePath: ./green-pavlodar/Dockerfile
    dockerContext: ./green-pavlodar
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: green-pavlodar-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq          # бесплатный ИИ; ключ LLM_API_KEY добавьте в панели Render (см. DEPLOY.md)
      - key: EDITING_ENABLED
        value: "true"    # поставьте false, чтобы сайт стал «только для просмотра»
