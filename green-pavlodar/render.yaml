# Blueprint для Render (https://render.com): сайт + база данных, всё создаётся одной кнопкой.
databases:
  - name: green-pavlodar-db
    plan: free            # бесплатная база Render живёт 30 дней с момента создания

services:
  - type: web
    name: green-pavlodar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: green-pavlodar-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq       # бесплатный ИИ; ключ LLM_API_KEY добавьте в панели Render (см. DEPLOY.md)
      - key: EDITING_ENABLED
        value: "true"     # поставьте false, чтобы сайт стал «только для просмотра»
