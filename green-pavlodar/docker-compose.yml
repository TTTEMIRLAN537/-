services:
  backend:
    build: ./backend
    container_name: pavlodar_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Ключ берётся из файла .env рядом с этим файлом (см. .env.example). Без ключа ИИ-функции
      # работают в режиме запасных правил/шаблонов, остальное — как обычно.
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - EDITING_ENABLED=${EDITING_ENABLED:-true}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATA_FILE=/app/storage/state.json
    volumes:
      - ./backend:/app
      - pavlodar_data:/app/storage   # данные сохраняются между перезапусками контейнера

  frontend:
    build: ./frontend
    container_name: pavlodar_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      # Адрес backend так, как его видит БРАУЗЕР
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pavlodar_data:
