version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pavlodar_postgis
    environment:
      POSTGRES_DB: green_pavlodar
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: pavlodar_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: pavlodar_frontend
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend